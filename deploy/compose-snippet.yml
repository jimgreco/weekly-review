# Proposed addition under `services:` in consolidated-deploy/docker-compose.yml.
# Activation follows that repository's reviewed process; see deploy/RUNBOOK.md.
#
# Default network only, for nginx-proxy. It needs no database: the weekly
# routine collects the data from each app's API and posts the finished review.
  weekly-review:
    profiles: ["weekly-review"]
    image: ${WEEKLY_REVIEW_IMAGE:-ghcr.io/jimgreco/weekly-review:unconfigured}
    restart: unless-stopped
    env_file:
      - path: ./weekly-review.env
        required: true
    environment:
      DATA_DIR: /data
    volumes:
      - ./weekly-review-data:/data
    expose: ["8790"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 160m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
