name: CI and image

# Tests every push. On main, the shared release-tools workflow publishes an
# exact-commit ARM64 image to GHCR and releases it on the shared host with
# release.py (replaces only the weekly-review container; drift-checked,
# health-checked, rolled back on failure). Until the owner first activates the
# service (deploy/RUNBOOK.md), the host release is a no-op.
# Pull requests never get secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: jimgreco/release-tools/.github/workflows/server-release.yml@ff61f1c6a6eb51ea982246473203bcc903ce8153
    with:
      tools_ref: ff61f1c6a6eb51ea982246473203bcc903ce8153
    secrets:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
